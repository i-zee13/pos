<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storeeo POS — Shop Setup</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #1a2332 0%, #2c3e50 55%, #1a2332 100%);
      color: #f5f0e8;
      padding: 1.5rem;
    }
    .box {
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(245,240,232,0.15);
      padding: 2rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; font-weight: 600; }
    p { margin: 0 0 1.25rem; line-height: 1.5; opacity: 0.9; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; opacity: 0.85; }
    input {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid rgba(245,240,232,0.25);
      background: rgba(0,0,0,0.25);
      color: #f5f0e8;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: 1px solid #c4a574; }
    button {
      width: 100%;
      padding: 0.85rem;
      border: 0;
      background: #c4a574;
      color: #1a2332;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err { color: #ffb4b4; font-size: 0.85rem; min-height: 1.2rem; margin: 0 0 0.75rem; }
    .hint { font-size: 0.8rem; opacity: 0.65; margin-top: 1rem; line-height: 1.45; }
    ul { margin: 0 0 1rem; padding-left: 1.2rem; opacity: 0.9; font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Storeeo POS — Local</h1>
    <p>Yeh app shop pe <strong>hamesha local</strong> chalegi (net ho ya na ho). Data is PC pe safe rehta hai.</p>
    <ul>
      <li>Login: <strong>admin</strong> / <strong>admin123</strong> (pehli dafa password change zaroori)</li>
      <li>Backup: app ke andar Backups, ya yahan se USB/Drive</li>
    </ul>
    <label for="shopName">Shop name</label>
    <input id="shopName" type="text" placeholder="e.g. Ali Traders" autocomplete="organization" />
    <div class="err" id="err"></div>
    <button id="save" type="button">Start Local POS</button>
    <p class="hint" id="hint">Pehli dafa 30–60 sec lag sakte hain.</p>
  </div>
  <script>
    (async () => {
      const shopName = document.getElementById('shopName');
      const err = document.getElementById('err');
      const hint = document.getElementById('hint');
      const btn = document.getElementById('save');

      try {
        const info = await window.posDesktop.getInfo();
        if (info.shopName) shopName.value = info.shopName;
        hint.textContent = 'v' + info.version + ' · local-only shopkeeper build';
      } catch (e) {}

      btn.addEventListener('click', async () => {
        err.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Starting local…';
        try {
          if (window.posDesktop.completeShopSetup) {
            await window.posDesktop.completeShopSetup({
              shopName: (shopName.value || '').trim() || 'My Shop',
            });
          } else {
            await window.posDesktop.savePosUrl({
              shopName: (shopName.value || '').trim() || 'My Shop',
              posUrl: 'https://pos.storeeo.app',
              forceLocalMode: true,
            });
          }
        } catch (e) {
          err.textContent = e.message || String(e);
          btn.disabled = false;
          btn.textContent = 'Start Local POS';
        }
      });
    })();
  </script>
</body>
</html>
